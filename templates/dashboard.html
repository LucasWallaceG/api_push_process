<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Monitor — Automação PJe</title>
    <style>
    /* ───────────────────────────────────────────────────────────────
       Push Monitor — design system institucional
       Tokens de cor separados: accent (marca) x semânticas (status),
       para status nunca competir visualmente com a marca.
       ─────────────────────────────────────────────────────────────── */
    :root{
        --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --line:#dfe4ec;
        --ink:#16202e; --ink-soft:#5a6a7e; --ink-faint:#8a97a8;
        --accent:#3b4fa8; --accent-soft:#e8ecfb;
        --ok:#0f7a4d;   --ok-bg:#e3f5ec;
        --warn:#9a6100; --warn-bg:#fdf0d9;
        --crit:#b3261e; --crit-bg:#fbe6e4;
        --run:#245b8f;  --run-bg:#e2eefb;
        --idle:#5a6a7e; --idle-bg:#e9edf3;
        --radius:10px;
        --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
        --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --shadow:0 1px 2px rgba(16,32,54,.06), 0 4px 12px rgba(16,32,54,.05);
    }
    @media (prefers-color-scheme:dark){
        :root{
            --bg:#0e141c; --surface:#151e29; --surface-2:#1c2836; --line:#2a3846;
            --ink:#e8eef6; --ink-soft:#a3b1c2; --ink-faint:#6f7f92;
            --accent:#8b9cf0; --accent-soft:#1e2748;
            --ok:#4cc38a;   --ok-bg:#102a1e;
            --warn:#e0a94a; --warn-bg:#2e2412;
            --crit:#f0796d; --crit-bg:#2f1614;
            --run:#6bb0f0;  --run-bg:#12243a;
            --idle:#a3b1c2; --idle-bg:#1c2836;
            --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
        }
    }

    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
    .wrap{max-width:1440px;margin:0 auto;padding:20px 18px 56px}

    /* ── Cabeçalho ── */
    header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
    .logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;
          display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;letter-spacing:.5px}
    h1{font-size:19px;margin:0;letter-spacing:-.2px}
    .sub{color:var(--ink-faint);font-size:12.5px;margin-top:1px}
    .spacer{flex:1}
    .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft)}
    .dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
         padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;
         display:inline-flex;align-items:center;gap:7px;transition:.15s;text-decoration:none}
    .btn:hover{border-color:var(--accent);color:var(--accent)}
    .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    /* ── KPIs ── */
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
    .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
         padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--idle)}
    .kpi.is-queue::before{background:var(--idle)}
    .kpi.is-run::before{background:var(--run)}
    .kpi.is-ok::before{background:var(--ok)}
    .kpi.is-crit::before{background:var(--crit)}
    .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint)}
    .kpi-value{font-size:26px;font-weight:700;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums}

    /* ── Filtros ── */
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .filters{padding:12px 15px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:11px;align-items:flex-end}
    .field{display:flex;flex-direction:column;gap:5px;min-width:135px}
    .field label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint)}
    .filters input,.filters select{
        padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;
        color:var(--ink);background:var(--surface-2);outline:none;font-family:inherit;transition:.15s}
    .filters input:focus,.filters select:focus{border-color:var(--accent);background:var(--surface);
        box-shadow:0 0 0 3px var(--accent-soft)}
    .filters input::placeholder{color:var(--ink-faint)}
    .btn-clear{margin-left:auto;padding:9px 18px;background:var(--accent-soft);color:var(--accent);
        border:1px solid transparent;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;
        font-family:inherit;transition:.15s}
    .btn-clear:hover{border-color:var(--accent)}

    /* ── Tabela ── */
    .table-wrap{overflow:hidden}
    .table-head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;
        justify-content:space-between;align-items:center;gap:10px}
    .table-head h2{font-size:14px;font-weight:600;margin:0}
    .table-count{font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
    .scroll-x{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:900px}
    thead th{padding:9px 13px;text-align:left;font-size:11px;text-transform:uppercase;
        letter-spacing:.7px;color:var(--ink-faint);background:var(--surface-2);
        border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
    tbody td{padding:9px 13px;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--ink-soft)}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover{background:var(--surface-2)}

    .col-ordem{width:56px;text-align:center;color:var(--ink-faint);font-variant-numeric:tabular-nums}
    .col-processo{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap}
    .col-msg{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .col-print{white-space:nowrap;text-align:center}
    .col-data{white-space:nowrap;font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
    .print-link{color:var(--accent);text-decoration:none;font-size:12.5px;font-weight:500;white-space:nowrap}
    .print-link:hover{text-decoration:underline}

    /* ── Badges de status ── */
    .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
        font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
    .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .badge-sucesso{background:var(--ok-bg);color:var(--ok)}
    .badge-aviso{background:var(--warn-bg);color:var(--warn)}
    .badge-erro{background:var(--crit-bg);color:var(--crit)}
    .badge-processando{background:var(--run-bg);color:var(--run)}
    .badge-aguardando{background:var(--idle-bg);color:var(--idle)}

    /* ── Vazio ── */
    .empty-state{padding:56px 20px;text-align:center;color:var(--ink-faint)}
    .empty-state p{font-size:14px;margin:0}

    /* ── Paginação ── */
    .pagination{display:flex;justify-content:center;align-items:center;gap:5px;
        padding:12px 15px;border-top:1px solid var(--line);flex-wrap:wrap}
    .page-btn{min-width:32px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:8px;
        background:var(--surface);color:var(--ink-soft);font-size:13px;cursor:pointer;
        font-family:inherit;transition:.15s}
    .page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    .page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
    .page-btn:disabled{opacity:.4;cursor:default}
    .page-info{font-size:13px;color:var(--ink-faint);margin:0 4px}

    @media (max-width:720px){
        .kpis{grid-template-columns:repeat(2,1fr)}
        .btn-clear{margin-left:0;width:100%}
        .field{min-width:100%}
    }
    </style>
</head>
<body>
<div class="wrap">

    <header>
        <div class="logo">PJe</div>
        <div>
            <h1>Push Monitor</h1>
            <div class="sub">Automação de cadastro e exclusão de Push no PJe</div>
        </div>
        <div class="spacer"></div>
        <span class="live"><span class="dot-live"></span><span id="last-update">Atualizando…</span></span>
        <a class="btn" href="/docs" target="_blank" rel="noopener">📘 Guia da API</a>
    </header>

    <!-- KPIs -->
    <div class="kpis">
        <div class="kpi is-queue">
            <div class="kpi-label">Na fila</div>
            <div class="kpi-value" id="kpi-fila">0</div>
        </div>
        <div class="kpi is-run">
            <div class="kpi-label">Processando</div>
            <div class="kpi-value" id="kpi-processando">0</div>
        </div>
        <div class="kpi is-ok">
            <div class="kpi-label">Sucesso</div>
            <div class="kpi-value" id="kpi-sucesso">0</div>
        </div>
        <div class="kpi is-crit">
            <div class="kpi-label">Erro</div>
            <div class="kpi-value" id="kpi-erro">0</div>
        </div>
    </div>

    <!-- Filtros -->
    <div class="panel filters">
        <div class="field">
            <label for="filter-periodo">Período</label>
            <select id="filter-periodo">
                <option value="">Hoje</option>
                <option value="ontem">Ontem</option>
                <option value="7">Últ. 7 dias</option>
                <option value="15">Últ. 15 dias</option>
                <option value="30">Últ. 30 dias</option>
                <option value="45">Últ. 45 dias</option>
                <option value="60">Últ. 60 dias</option>
            </select>
        </div>
        <div class="field">
            <label for="filter-data-inicio">Data inicial</label>
            <input type="date" id="filter-data-inicio">
        </div>
        <div class="field">
            <label for="filter-data-fim">Data final</label>
            <input type="date" id="filter-data-fim">
        </div>
        <div class="field">
            <label for="filter-status">Status</label>
            <select id="filter-status">
                <option value="">Todos</option>
                <option value="AGUARDANDO">Aguardando</option>
                <option value="PROCESSANDO">Processando</option>
                <option value="SUCESSO">Sucesso</option>
                <option value="AVISO">Aviso</option>
                <option value="ERRO">Erro</option>
            </select>
        </div>
        <div class="field">
            <label for="filter-trt">TRT</label>
            <select id="filter-trt">
                <option value="">Todos</option>
            </select>
        </div>
        <div class="field">
            <label for="filter-processo">Processo</label>
            <input type="text" id="filter-processo" placeholder="Buscar processo…">
        </div>
        <button class="btn-clear" onclick="clearFilters()">Limpar filtros</button>
    </div>

    <!-- Tabela -->
    <div class="panel table-wrap">
        <div class="table-head">
            <h2>Processos</h2>
            <span class="table-count" id="table-count">0 registros</span>
        </div>
        <div class="scroll-x">
            <table>
                <thead>
                    <tr>
                        <th class="col-ordem">#</th>
                        <th>Processo</th>
                        <th>TRT</th>
                        <th>Grau</th>
                        <th>Ação</th>
                        <th>Status</th>
                        <th>Mensagem</th>
                        <th>Print</th>
                        <th>Data/Hora</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="9">
                            <div class="empty-state">
                                <p>Nenhum processo registrado ainda</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

</div>

    <script>
        const POLL_INTERVAL = 3000;
        const PAGE_SIZE = 10;
        let allData = [];
        let currentPage = 1;

        function toISODate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function calcDateRange() {
            const periodo = document.getElementById('filter-periodo').value;
            const inputInicio = document.getElementById('filter-data-inicio').value;
            const inputFim = document.getElementById('filter-data-fim').value;

            // Inputs de data tem prioridade quando preenchidos
            if (inputInicio || inputFim) {
                return { data_inicio: inputInicio || '', data_fim: inputFim || '' };
            }

            const hoje = new Date();

            if (periodo === 'ontem') {
                const ontem = new Date(hoje);
                ontem.setDate(ontem.getDate() - 1);
                const d = toISODate(ontem);
                return { data_inicio: d, data_fim: d };
            }

            if (periodo && !isNaN(periodo)) {
                const dias = parseInt(periodo);
                const inicio = new Date(hoje);
                inicio.setDate(inicio.getDate() - dias);
                return { data_inicio: toISODate(inicio), data_fim: toISODate(hoje) };
            }

            // Padrao: hoje
            const d = toISODate(hoje);
            return { data_inicio: d, data_fim: d };
        }

        function badgeClass(status) {
            const map = {
                'SUCESSO': 'badge-sucesso',
                'AVISO': 'badge-aviso',
                'ERRO': 'badge-erro',
                'PROCESSANDO': 'badge-processando',
                'AGUARDANDO': 'badge-aguardando'
            };
            return map[status] || 'badge-aguardando';
        }

        function formatDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        function updateKPIs(registros) {
            let fila = 0, processando = 0, sucesso = 0, erro = 0;
            registros.forEach(r => {
                switch(r.status) {
                    case 'AGUARDANDO': fila++; break;
                    case 'PROCESSANDO': processando++; break;
                    case 'SUCESSO': case 'AVISO': sucesso++; break;
                    case 'ERRO': erro++; break;
                }
            });
            document.getElementById('kpi-fila').textContent = fila;
            document.getElementById('kpi-processando').textContent = processando;
            document.getElementById('kpi-sucesso').textContent = sucesso;
            document.getElementById('kpi-erro').textContent = erro;
        }

        function populateTRTs(registros) {
            const select = document.getElementById('filter-trt');
            const current = select.value;
            const trts = [...new Set(registros.map(r => r.trt).filter(Boolean))].sort((a,b) => a - b);

            // Keep existing options if same
            const existing = [...select.options].slice(1).map(o => o.value);
            if (JSON.stringify(existing) === JSON.stringify(trts.map(String))) {
                select.value = current;
                return;
            }

            select.innerHTML = '<option value="">Todos</option>';
            trts.forEach(trt => {
                const opt = document.createElement('option');
                opt.value = trt;
                opt.textContent = `TRT ${trt}`;
                select.appendChild(opt);
            });
            select.value = current;
        }

        function getFiltered(registros) {
            const status = document.getElementById('filter-status').value;
            const trt = document.getElementById('filter-trt').value;
            const proc = document.getElementById('filter-processo').value.trim().toLowerCase();

            return registros.filter(r => {
                if (status && r.status !== status) return false;
                if (trt && String(r.trt) !== trt) return false;
                if (proc && !(r.processo || '').toLowerCase().includes(proc)) return false;
                return true;
            });
        }

        function renderTable(registros) {
            const tbody = document.getElementById('table-body');
            const filtered = getFiltered(registros);
            const total = filtered.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

            if (currentPage > totalPages) currentPage = totalPages;

            document.getElementById('table-count').textContent = `${total} registro${total !== 1 ? 's' : ''}`;

            if (total === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="9">
                        <div class="empty-state">
                            <p>Nenhum processo encontrado</p>
                        </div>
                    </td></tr>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * PAGE_SIZE;
            const page = filtered.slice(start, start + PAGE_SIZE);

            tbody.innerHTML = page.map((r, i) => `
                <tr>
                    <td class="col-ordem">${r.ordem || start + i + 1}</td>
                    <td class="col-processo">${r.processo || '-'}</td>
                    <td>${r.trt ? 'TRT ' + r.trt : '-'}</td>
                    <td>${r.grau || '-'}</td>
                    <td>${r.acao || '-'}</td>
                    <td><span class="badge ${badgeClass(r.status)}">${r.status || '-'}</span></td>
                    <td class="col-msg" title="${(r.msg || '').replace(/"/g, '&quot;')}">${r.msg || '-'}</td>
                    <td class="col-print">${r.screenshot
                        ? `<a class="print-link" href="${r.screenshot}" target="_blank" rel="noopener" title="Abrir print da tela">🔍 Ver</a>`
                        : '-'}</td>
                    <td class="col-data">${formatDate(r.data_hora)}</td>
                </tr>
            `).join('');

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const el = document.getElementById('pagination');
            if (totalPages <= 1) { el.innerHTML = ''; return; }

            const prev = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&laquo;</button>`;
            const next = `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&raquo;</button>`;

            let pages = '';
            for (let p = 1; p <= totalPages; p++) {
                if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) {
                    pages += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                } else if (p === currentPage - 3 || p === currentPage + 3) {
                    pages += `<span class="page-info">…</span>`;
                }
            }

            el.innerHTML = prev + pages + next;
        }

        function goPage(p) {
            currentPage = p;
            renderTable(allData);
        }

        function clearFilters() {
            document.getElementById('filter-periodo').value = '';
            document.getElementById('filter-data-inicio').value = '';
            document.getElementById('filter-data-fim').value = '';
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-trt').value = '';
            document.getElementById('filter-processo').value = '';
            fetchDashboard();
        }

        async function fetchDashboard() {
            try {
                const range = calcDateRange();
                const params = new URLSearchParams();
                if (range.data_inicio) params.set('data_inicio', range.data_inicio);
                if (range.data_fim) params.set('data_fim', range.data_fim);

                const res = await fetch('/api/dashboard?' + params.toString());
                const json = await res.json();
                allData = json.registros || [];

                updateKPIs(allData);
                populateTRTs(allData);
                renderTable(allData);

                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                document.getElementById('last-update').textContent =
                    `Atualizado ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            } catch (e) {
                console.error('Erro ao buscar dados:', e);
            }
        }

        // Filtros de periodo: recarregam dados do servidor
        document.getElementById('filter-periodo').addEventListener('change', () => {
            // Limpar inputs de data ao selecionar periodo por atalho
            document.getElementById('filter-data-inicio').value = '';
            document.getElementById('filter-data-fim').value = '';
            fetchDashboard();
        });
        document.getElementById('filter-data-inicio').addEventListener('change', () => {
            // Limpar select de periodo ao usar datas manuais
            document.getElementById('filter-periodo').value = '';
            fetchDashboard();
        });
        document.getElementById('filter-data-fim').addEventListener('change', () => {
            document.getElementById('filter-periodo').value = '';
            fetchDashboard();
        });

        // Filtros locais: re-render na tabela existente (volta para página 1)
        document.getElementById('filter-status').addEventListener('change', () => { currentPage = 1; renderTable(allData); });
        document.getElementById('filter-trt').addEventListener('change', () => { currentPage = 1; renderTable(allData); });
        document.getElementById('filter-processo').addEventListener('input', () => { currentPage = 1; renderTable(allData); });

        // Poll
        fetchDashboard();
        setInterval(fetchDashboard, POLL_INTERVAL);
    </script>

</body>
</html>
